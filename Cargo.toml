[package]
name = "papermache"
version = "0.3.0"
edition = "2021"
description = "3d model design, via mcp (rust)"
license = "MIT"
readme = "README.md"
keywords = ["3d", "mcp", "raytracer", "modeling", "render"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rayon = "1.12"
png = "0.17.16"
ab_glyph = "0.2.32"
base64 = "0.22.1"
tiny_http = "0.12"
hound = "3.5"
ureq = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
